[project]
name = "smart-meter-billing"
version = "0.1.0"
description = "WattWunder smart-meter billing: bill API"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "sqlalchemy>=2.1.6",
    "tzdata>=2026.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
crosscheck = [
    "pandas>=3.1.0",
]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
